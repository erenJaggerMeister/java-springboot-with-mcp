server:
  port: 8084

spring:
  application:
    name: msf_student
  ai:
    mcp:
      server:
        name: msf-student-mcp-server
        version: 1.0.0
        type: sync
        protocol: stateless
        streamable-http:
          mcp-endpoint: /api/msf_student/mcp

msm:
  student-service:
    url: ${MSM_STUDENT_URL:http://localhost:8082}
  security:
    rsa:
      key-id: msm-rsa-2048-key
      issuer: msf-auth-service
      # Public key for token verification
      public-key: ${RSA_PUBLIC_KEY:}
      public-key-path: ${RSA_PUBLIC_KEY_PATH:}
      public-key-url: ${RSA_PUBLIC_KEY_URL:http://localhost:8080/api/v1/auth/public-key}

logging:
  level:
    root: INFO
    com.example: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId:-NONE}] - %msg%n"
